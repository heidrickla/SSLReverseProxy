# CI for SSLReverseProxy: build, unit and integration tests, every generated
# config through a real `caddy validate`, frontend typecheck and build, browser
# tests against the real API and a running Caddy, the container image, a
# dependency CVE audit and a committed-secret guard. No credentials.
#
# Caddy is built with the caddy-ratelimit plugin and the Cloudflare DNS provider
# at the pins in server/Dockerfile (.github/actions/caddy) and cached on them.
# SSLRP_REQUIRE_CADDY=1 makes the Caddy tests fail, not skip, when the binary or
# a module is missing.
#
# The forge holds main and GitHub mirrors it; both run these jobs. The forge's
# Gitea ignores a job's timeout-minutes, concurrency and permissions, so every
# step that can hang carries its own timeout-minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The dependency audit is why this exists. Its INPUT barely moves -- a lock
  # file changes only when someone bumps a package -- while the thing that DOES
  # move is the advisory database. A purely push-triggered audit answers "were
  # these clean when we last touched them", not "are they clean today". This
  # repo has already collected seven Dependabot alerts against dependencies
  # nobody edited, which is exactly the blind spot a schedule closes.
  # 04:23 rather than the hour: GitHub queues scheduled workflows hardest on :00.
  schedule:
    - cron: "23 4 * * *"

# Least privilege: no scopes. The one exception is audit-heal, which commits
# bun's own audit fix to the branch it ran on.
permissions: {}

# A newer push makes an in-flight run's answer irrelevant -- cancel it rather
# than letting a stale result land after a fresher one. Keyed on ref so main and
# each PR are independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are what branch protection matches on. RENAMING ONE IS THE SAME
  # OUTAGE AS DELETING IT: protection keeps waiting for a check that will never
  # report again. "Backend (.NET)" and "Frontend (React)" are unchanged from the
  # original workflow for that reason, even though both now do more than before.
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Actions pinned by commit SHA, not tag. A tag is mutable -- whoever
      # controls the action can repoint v4 at new code, and it would run here
      # with whatever permissions this workflow has. The trailing comment is the
      # human-readable version; the SHA is what actually gets fetched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: ./.github/actions/caddy
        timeout-minutes: 15
      - run: dotnet restore
        timeout-minutes: 10
      - run: dotnet build --no-restore --configuration Release
        timeout-minutes: 10
      - run: dotnet test --no-build --configuration Release --verbosity normal
        timeout-minutes: 15
        env:
          SSLRP_REQUIRE_CADDY: '1'

      # Prove the detector can fail BEFORE trusting it to pass. The self-test
      # feeds it fixtures with known answers and asserts it flags a critical
      # finding, stays quiet on a clean document, and rejects a schema it has
      # not been verified against.
      #
      # Deliberately synthetic rather than a live vulnerable package: a real
      # advisory can be re-rated or withdrawn, which would make the probe's
      # result depend on an external database rather than on this repo. The
      # fixtures are deterministic; the live run below is the actual gate.
      - name: Vulnerability detector self-test
        working-directory: .
        run: python3 .github/scripts/check_nuget_vulns.py --selftest

      # BLOCKING at high/critical, and it starts green: verified against the
      # tree on 2026-08-11 with no vulnerable packages. A gate that arrives red
      # is a gate people learn to click past.
      #
      # `dotnet list package --vulnerable` EXITS 0 EVEN WHEN IT FINDS SOMETHING
      # (verified against a deliberately vulnerable project), so the exit code
      # cannot be the gate. Grepping the human-readable table fails OPEN -- a
      # column change, a localised runner or an empty result all produce "no
      # match", which is indistinguishable from "nothing vulnerable". The parser
      # reads --format json and refuses documents it does not recognise.
      #
      # pipefail matters here: without it the pipeline would report the parser's
      # status only, and a dotnet crash producing no output would sail through.
      - name: Dependency CVEs (.NET, high+)
        timeout-minutes: 5
        run: |
          set -uo pipefail
          dotnet list package --vulnerable --include-transitive --format json \
            | python3 "$GITHUB_WORKSPACE/.github/scripts/check_nuget_vulns.py"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node runs Vitest and Vite: the suite needs Node 22.12 or later and does not run under Bun's
      # runtime. Bun installs the packages, runs the scripts and audits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        timeout-minutes: 10
      - run: bunx tsc --noEmit
        timeout-minutes: 5
      - run: bun run test
        timeout-minutes: 10
      - run: bun run build
        timeout-minutes: 5

      # BLOCKING at high/critical only, and it starts green (0 vulnerabilities
      # on 2026-08-11 at every level).
      #
      # WHY NOT ALL LEVELS: a low-severity advisory published overnight against
      # an untouched transitive dependency would block every PR until someone
      # triaged it, with no defect in this repo. High and critical are worth
      # stopping for; low and moderate are worth knowing about, which is what
      # the advisory step below prints without failing.
      #
      # On push and PR only. Scheduled and manual runs gate through audit-heal,
      # which takes bun's fix where one exists and fails where none does.
      - name: Dependency CVEs (bun, high+)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        timeout-minutes: 5
        run: bun audit --audit-level=high
      - name: Dependency advisories (all levels, advisory)
        timeout-minutes: 5
        run: bun audit || true

      # Folded in here rather than given its own job: it is a two-second
      # `git ls-files | grep`, and a separate job would burn a full billable
      # minute on VM boot and checkout to run it.
      #
      # Deliberately narrow -- it proves the material that must never be
      # committed is absent, not that the repo holds nothing sensitive, which no
      # grep can establish. Markdown is excluded because the docs legitimately
      # quote key-shaped examples, and a guard that cries wolf gets ignored.
      # Verified clean against the tree before being made blocking.
      - name: No private keys or env files committed
        run: |
          set -euo pipefail
          bad=0
          keyfiles=$(git ls-files | grep -iE '(^|/)\.env$|\.pem$|\.p12$|\.pfx$|(^|/)id_(rsa|ed25519)$' || true)
          if [ -n "$keyfiles" ]; then
            echo "::error::a key or .env file is tracked in git"; echo "$keyfiles"; bad=1
          fi
          hits=$(git grep -lIE 'BEGIN (RSA|EC|OPENSSH|PGP|DSA) PRIVATE KEY' -- . ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::a private key block is committed"; echo "$hits"; bad=1
          fi
          exit $bad

  # The production build, with its CSP, against a real Development control plane
  # seeded with demo data (Seed:Demo): every view in both themes without console
  # errors, the self-hosted font, server statuses and their live update over
  # /api/events, and Caddy started by the API serving traffic that reaches the
  # dashboard. playwright.config.ts starts both servers on a new database.
  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: ./.github/actions/caddy
        timeout-minutes: 15
      - run: bun install --frozen-lockfile
        timeout-minutes: 10
      - run: bunx playwright install --with-deps chromium
        timeout-minutes: 15
      # Built first so the config's `dotnet run` starts well inside its timeout.
      - run: dotnet build server/src/SslReverseProxy.Api
        timeout-minutes: 10
      - run: bun run e2e
        timeout-minutes: 20
        env:
          SSLRP_REQUIRE_CADDY: '1'
      # upload-artifact v4 refuses any server but github.com and GitHub fails a job that names v3,
      # so a forge failure's report stays in the step log.
      - if: failure() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # server/Dockerfile built as shipped: its Caddy carries both modules,
  # and the API answers the compose healthcheck's own command inside the container.
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 30
        with:
          context: server
          load: true
          tags: sslreverseproxy:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      # The forge's jobs share the runner host's Docker daemon: the container gets this run's name
      # and is removed on every exit.
      - name: Caddy modules present, healthcheck answers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          name="sslrp-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          trap 'docker rm -f "$name" > /dev/null 2>&1 || true' EXIT
          modules=$(docker run --rm --entrypoint caddy sslreverseproxy:ci list-modules)
          grep -qx 'http.handlers.rate_limit' <<< "$modules"
          grep -qx 'dns.providers.cloudflare' <<< "$modules"
          docker run -d --name "$name" -e Security__ApiKeyPepper="$(openssl rand -base64 32)" sslreverseproxy:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' "$name")" = true ] || break
            if docker exec "$name" curl -fsS http://localhost:8080/api/health; then
              docker exec "$name" test -f /data/sslrp.db
              exit 0
            fi
            sleep 1
          done
          docker logs "$name"
          exit 1

  # The high+ gate for scheduled and manual runs, on the npm registry's advisories
  # (the job name keeps "npm" for that, and so that nothing matching on it breaks).
  # A new advisory that bun can fix within the declared ranges is fixed and
  # committed here, so it never reaches the inbox as a failure; one it cannot fix
  # (no patched release in range) still fails the run. It runs on the forge only:
  # the fix is a commit to main, and GitHub's copy is a mirror of the forge's.
  audit-heal:
    name: Dependency CVEs (npm, high+, self-fixing)
    if: github.server_url != 'https://github.com' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node runs Vitest and Vite: the suite needs Node 22.12 or later and does not run under Bun's
      # runtime. Bun installs the packages, runs the scripts and audits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        timeout-minutes: 10
      - name: Audit, and commit bun's fix when it clears the gate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if bun audit --audit-level=high; then exit 0; fi
          # --json prints the registry's advisories keyed by package
          ids=$( (bun audit --json || true) | jq -r '[.[][]
            | select(.severity == "high" or .severity == "critical") | .url | sub(".*/"; "")] | unique | join(", ")')
          # the high+ audit below is the gate, not the fix's own exit status
          bun audit fix || true
          # bun's fix may touch the manifest and the lock file, nothing else
          changed=$(git diff --name-only)
          if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvxE 'package\.json|bun\.lock'; then
            echo "::error::bun audit fix changed: ${changed:-nothing}"; exit 1
          fi
          bun audit --audit-level=high
          bunx tsc --noEmit
          bun run test
          bun run build
          git config user.name "gitea-actions"
          git config user.email "teabot@gitea.io"
          git commit -qam "Take bun's audit fix for ${ids:-the high advisories}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "::notice::committed bun's audit fix for ${ids:-the high advisories} to ${GITHUB_REF_NAME}"
