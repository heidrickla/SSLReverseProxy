# Runs the control-plane API (which manages Caddy as a child process) with a
# persisted data volume. The proxy (80/443) is published on every interface and the
# control API (8080, plain HTTP) on the host's loopback only; serve it further through
# your own TLS or mutual-TLS edge.

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"     # proxy HTTP (ACME challenges)
      - "443:443"   # proxy HTTPS
      - "127.0.0.1:8080:8080" # control API, loopback only: publish it through your own TLS or mTLS edge
    environment:
      # Provide the pepper and any secrets via the host environment or a secrets
      # manager — do not bake them into the image.
      Security__ApiKeyPepper: "${SSLRP_API_KEY_PEPPER:?set SSLRP_API_KEY_PEPPER}"
      Proxy__AcmeContactEmail: "${SSLRP_ACME_EMAIL:-}"
      # DNS-01 through Cloudflare: a token with Zone:Read and DNS:Edit. Caddy reads it from its environment.
      Proxy__CloudflareApiToken: "${SSLRP_CLOUDFLARE_API_TOKEN:-}"
      Security__CorsAllowedOrigins__0: "${SSLRP_SPA_ORIGIN:-}"
      # Passkey sign-in: the UI's host and origin, such as proxy.example.com and https://proxy.example.com.
      Passkeys__RelyingPartyId: "${SSLRP_PASSKEY_RP_ID:-}"
      Passkeys__Origins__0: "${SSLRP_PASSKEY_ORIGIN:-}"
    volumes:
      - sslrp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sslrp-data:
